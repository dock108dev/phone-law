version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    # TypeScript must stay within typescript-eslint's declared peer range.
    # Revisit this ceiling together with the linter when upgrading the compiler.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The browser package and Docker image must be upgraded in one change.
      - dependency-name: "@playwright/test"
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /infrastructure/local
    schedule:
      interval: weekly
      day: monday
    # These images have matching declarations outside Dependabot's Docker scope.
    # Upgrade Node with .nvmrc, Python with .python-version/pyproject.toml,
    # and Playwright with @playwright/test in a coordinated maintenance change.
    ignore:
      - dependency-name: node
      - dependency-name: python
      - dependency-name: mcr.microsoft.com/playwright
    groups:
      runtime-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
