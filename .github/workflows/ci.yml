name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_ANSI: never

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build validation images
        run: docker compose build api web

      - name: Run static checks, tests, build, and audits
        run: make lint typecheck test build audit

      - name: Clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Bootstrap pinned application images and database
        run: make bootstrap

      - name: Run PostgreSQL integration tests
        run: make test-integration

      - name: Run service smoke checks
        run: |
          docker compose up -d --wait api worker web
          make smoke

      - name: Capture service diagnostics
        if: failure()
        run: docker compose logs --no-color api worker web db > /tmp/colacci-law-ci-services.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-service-logs
          path: /tmp/colacci-law-ci-services.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Run synthetic browser journeys
        run: make test-e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: /tmp/colacci-law-slice2-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up containers
        if: always()
        run: |
          docker compose -p colacci-law-e2e --profile e2e down --volumes --remove-orphans
          docker compose down --volumes --remove-orphans
