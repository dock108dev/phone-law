name: colacci-law

x-python-service: &python-service
  build:
    context: .
    dockerfile: infrastructure/local/python.Dockerfile
  environment: &python-environment
    APP_PROFILE: ${APP_PROFILE:-demo}
    APP_VERSION: 0.1.0
    ALLOW_REAL_CALL_DATA: "false"
    REAL_CALL_PROCESSING_AUTHORIZED: "false"
    AUTH_MODE: fake
    APP_SECRET: demo-placeholder-not-a-deployable-secret
    DATABASE_URL: postgresql+psycopg://colacci_demo:local-demo-only-password@db:5432/colacci_demo
    OBJECT_STORAGE_BACKEND: local_synthetic
    OBJECT_STORAGE_BUCKET: synthetic-only
    CALL_SOURCE_ADAPTER: fixture
    TRANSCRIBER_ADAPTER: fixture
    ANALYZER_ADAPTER: fixture
    NOTIFICATION_ADAPTER: noop
    AUDIO_RETENTION_DAYS: "0"
    TRANSCRIPT_RETENTION_DAYS: "0"
    ANALYSIS_RETENTION_DAYS: "0"
    AUDIT_RETENTION_DAYS: "0"
    RETENTION_POLICY_APPROVED: "false"
    DEBUG: "false"
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:15173"]}'
    FIRM_TIMEZONE: America/New_York
    LOG_LEVEL: INFO
    RUFF_CACHE_DIR: /tmp/ruff-cache
    MYPY_CACHE_DIR: /tmp/mypy-cache
    COVERAGE_FILE: /tmp/.coverage
    PYTHONPATH: /workspace
  volumes:
    - .:/workspace:ro
  networks:
    - app
  restart: unless-stopped

services:
  db:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: colacci_demo
      POSTGRES_USER: colacci_demo
      POSTGRES_PASSWORD: local-demo-only-password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/local/init-databases.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colacci_demo -d colacci_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - app
      - fixture
    restart: unless-stopped

  api:
    <<: *python-service
    command: ["python", "-m", "apps.api.colacci_api.main"]
    environment:
      <<: *python-environment
      SERVICE_NAME: api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  worker:
    <<: *python-service
    command: ["python", "-m", "apps.worker.colacci_worker.main"]
    environment:
      <<: *python-environment
      SERVICE_NAME: worker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2).read()",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  web:
    build:
      context: .
      dockerfile: infrastructure/local/web.Dockerfile
    environment:
      VITE_APP_PROFILE: demo
      VITE_ALLOW_REAL_CALL_DATA: "false"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18000}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/public:/workspace/apps/web/public:ro
      - ./apps/web/index.html:/workspace/apps/web/index.html:ro
      - ./apps/web/package.json:/workspace/apps/web/package.json:ro
      - ./apps/web/package-lock.json:/workspace/apps/web/package-lock.json:ro
      - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json:ro
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - ./apps/web/eslint.config.js:/workspace/apps/web/eslint.config.js:ro
    ports:
      - "127.0.0.1:15173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/healthz.json | grep -q '\"status\": \"up\"'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks:
      - app
    restart: unless-stopped

  e2e:
    build:
      context: .
      dockerfile: infrastructure/local/playwright.Dockerfile
    profiles: ["e2e"]
    environment:
      BASE_URL: http://web:5173
      EVIDENCE_DIR: /evidence
    command: ["npm", "run", "test:e2e"]
    volumes:
      - ${SLICE2_EVIDENCE_DIR:-/tmp/colacci-law-slice2-evidence}:/evidence
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge
  fixture:
    driver: bridge
    internal: true

volumes:
  postgres-data:
